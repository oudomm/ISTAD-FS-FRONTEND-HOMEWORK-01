<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Project</title>
    <script defer src="add.js"></script>
  </head>
  <body>
    <header>
      <h1>➕ Add Project</h1>

      <p id="message"></p>
    </main>
