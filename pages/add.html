<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Project</title>
    <script defer src="../js/add.js"></script>
  </head>
  <body>
    <header>
      <h1>
        <ion-icon name="add-circle"></ion-icon> Mini Deploy Manager - Add
        Project
      </h1>
      <nav>
        <a href="../index.html">Projects</a> |
        <a href="add.html">Add Project</a> |
        <a href="status.html">Status</a>
      </nav>
    </header>

    <main>
      <section>
        <h2>Project Details</h2>
        <!-- lottiefiles -->
        <dotlottie-player
          src="https://lottie.host/69c715cb-c040-4a48-8fb3-55766a62be56/XyZ8ZcvwH1.lottie"
          background="transparent"
          speed="1"
          style="width: 300px; height: 300px"
          loop
          autoplay
        ></dotlottie-player>
        <form id="project-form">
          <table>
            <tr>
              <td>&nbsp;<label for="name">Project Name:</label>&nbsp;</td>
              <td>
                &nbsp;<input type="text" name="name" id="name" required />&nbsp;
              </td>
            </tr>
            <tr>
              <td>&nbsp;<label for="gitUrl">Git URL:</label>&nbsp;</td>
              <td>
                &nbsp;<input
                  type="url"
                  name="gitUrl"
                  id="gitUrl"
                  required
                />&nbsp;
              </td>
            </tr>
            <tr>
              <td colspan="2" style="text-align: center">
                &nbsp;<button type="submit">Add Project</button>&nbsp;
              </td>
            </tr>
          </table>
        </form>
        <p id="message"></p>
      </section>
    </main>

    <footer>
      <p>&copy;&nbsp;2025&nbsp;Mini&nbsp;Deploy&nbsp;Manager</p>
    </footer>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <!-- lottiefiles -->
    <script
      src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"
      type="module"
    ></script>
  </body>
</html>
