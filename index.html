<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mini Deploy Manager - Projects</title>
    <script defer src="./js/index.js"></script>
    <style>
      header {
        display: flexbox;
      }
    </style>
  </head>
  <body>
    <header>
      <h1><ion-icon name="rocket"></ion-icon> Mini Deploy Manager</h1>
      <nav>
        <a href="index.html">Projects</a>&nbsp;|&nbsp;
        <a href="./pages/add.html">Add Project</a>&nbsp;|&nbsp;
        <a href="./pages/about.html">About</a>
      </nav>
    </header>

    <main>
      <h2>All Projects</h2>
      <!-- lottiefiles -->
      <dotlottie-player
        src="https://lottie.host/7848e5ab-fdbf-4b49-aefe-96e30a27791c/Nc6Uhfm1Vc.lottie"
        background="transparent"
        speed="1"
        style="width: 300px; height: 300px"
        loop
        autoplay
      ></dotlottie-player>
      <table id="project-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Git URL</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="project-list">
          <!-- Projects will be loaded here dynamically -->
        </tbody>
      </table>
    </main>

    <footer>
      <p>&copy; 2025 Mini Deploy Manager</p>
    </footer>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <!-- lottiefiles -->
    <script
      src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"
      type="module"
    ></script>
  </body>
</html>
